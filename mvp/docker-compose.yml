# Stack de referencia según cap. 15 de la tesis (PostgreSQL + FastAPI + React),
# + Metabase opcional para explorar la base y armar gráficos de lectura.
#
# Uso (Fase 2, P01 — ver docs/despliegue.md):
#   cp .env.example .env            # y completar JWT_SECRET (obligatorio)
#   docker compose up --build -d
#   docker compose exec backend python -m scripts.seed_teacher docente@uade.edu.ar 1234
#   (o definir SEED_TEACHERS en .env para crear los docentes al arrancar)
#
# Dashboard docente: http://localhost:5173
# API:               http://localhost:8010   (salud: /health)
# Metabase (opcional): docker compose --profile metabase up -d -> http://localhost:3000
#   (asistente de setup: PostgreSQL, host "db", puerto 5432, base/usuario/clave "improntia")
#
# Para que la vea otra computadora de la misma red, poner en .env la IP de esta máquina:
#   PUBLIC_API_URL=http://192.168.0.10:8010  y  CORS_ORIGINS=http://192.168.0.10:5173
# y volver a construir el dashboard (docker compose up --build -d): Vite incrusta la URL al compilar.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: improntia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-improntia}
      POSTGRES_DB: improntia
    # Solo accesible desde los otros contenedores; para inspeccionarla desde la máquina:
    # docker compose exec db psql -U improntia
    volumes:
      - improntia_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U improntia"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # Commit con el que se construye (GET /health lo devuelve). Ver README, "Reproducibilidad":
      #   GIT_COMMIT=$(git rev-parse HEAD) docker compose up --build -d
      args:
        GIT_COMMIT: ${GIT_COMMIT:-desconocido}
    environment:
      IMPRONTIA_ENV: production
      DATABASE_URL: postgresql+psycopg2://improntia:${POSTGRES_PASSWORD:-improntia}@db:5432/improntia
      # Obligatorio: el backend no arranca en producción sin un secreto propio.
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env (ver .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_TEACHERS: ${SEED_TEACHERS:-}
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8010}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-desconocido}
    ports:
      - "5173:4173"
    depends_on:
      - backend
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    profiles: ["metabase"]
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  improntia_db_data:
  metabase_data:
