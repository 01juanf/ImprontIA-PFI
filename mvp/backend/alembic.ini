# Configuración de Alembic (Fase 2, P02). Ver app/db_migrations.py y la bitácora (Incremento 14).
# La URL de la base NO se fija acá: env.py la toma de DATABASE_URL (app/config.py),
# igual que el backend. Uso, desde mvp/backend:
#   alembic upgrade head        # aplica las migraciones pendientes
#   alembic current             # revisión aplicada
#   alembic revision --autogenerate -m "descripcion"   # nueva migración desde models.py
# El backend también aplica `upgrade head` solo al arrancar (app/db_migrations.py).
[alembic]
script_location = migrations
file_template = %%(rev)s
